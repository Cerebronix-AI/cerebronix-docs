openapi: 3.0.3
info:
  title: Cerebronix Public API
  version: 1.0.0
  description: >
    Authoritative public developer API specification for Cerebronix.
    Provides programmatic access to AI agents, unified multi-channel conversations,
    knowledge base indexing, WhatsApp outreach, webhooks, Model Context Protocol (MCP),
    and credit billing management.
servers:
  - url: https://public-api.cerebronix.com
    description: Production Public API Gateway

tags:
  - name: Authentication
    description: OAuth2 client credentials token issuance and actor inspection
  - name: Organizations
    description: Multi-tenant organization tenant discovery
  - name: Conversations
    description: Customer support conversations, operator messaging, handoffs, and resolutions
  - name: Realtime WebSockets
    description: Real-time operator and visitor WebSocket ticket exchange and connections
  - name: Contacts
    description: Customer contact directory and custom attribute storage
  - name: Contact Groups
    description: Segmented audience groups and membership management
  - name: Outreach & WhatsApp
    description: WhatsApp Business templates and outbound campaign orchestration
  - name: Webhooks
    description: Event subscriptions and HMAC-SHA256 signature secret rotation
  - name: AI Agents
    description: Autonomous AI agents, prompt configurations, data source bindings, and direct inference
  - name: Channels
    description: Omnichannel ingress endpoints (WhatsApp, Web Chat, Telegram, Instagram)
  - name: Knowledge Engine
    description: RAG knowledge sources (freetext, websites, YouTube channels) and vector indexing
  - name: Analytics
    description: Conversational performance and resolution reporting
  - name: Billing
    description: Prepaid credit balance, Lago plan entitlements, and transaction ledger
  - name: Model Context Protocol
    description: JSON-RPC 2.0 HTTP POST endpoint exposing 30 Cerebronix tools (MCP protocol version 2024-11-05)

paths:
  /healthz:
    get:
      tags: [Authentication]
      summary: Health check
      operationId: getHealthz
      description: Returns service liveness status. Requires no authentication.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /.well-known/jwks.json:
    get:
      tags: [Authentication]
      summary: JSON Web Key Set (JWKS)
      operationId: getJWKS
      description: Exposes public RS256/ES256 verification keys for validating Cerebronix JWT tokens.
      security: []
      responses:
        '200':
          description: Active public cryptographic keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSResponse'

  /v1/oauth/token:
    post:
      tags: [Authentication]
      summary: Mint OAuth2 access token
      operationId: createOAuthToken
      description: Authenticates API Key client credentials and mints an RS256 Bearer access token valid for 60 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token minted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Unsupported grant type or malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid client ID or secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/me:
    get:
      tags: [Authentication]
      summary: Inspect current authenticated actor
      operationId: getMe
      description: Returns the actor ID, organization ID, and assigned role for the authenticated Bearer token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Actor profile and organization context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorMe'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /v1/organizations:
    get:
      tags: [Organizations]
      summary: List authorized organizations
      operationId: listOrganizations
      description: Returns tenant organizations accessible to the authenticated API key.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of authorized organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /v1/organizations/{organization_id}/conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      operationId: listConversations
      description: Retrieves conversations for the specified organization with optional status and cursor filtering.
      security:
        - BearerAuth: [conversations:read]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, pending, resolved]
          description: Filter conversations by resolution status
      responses:
        '200':
          description: Paginated conversation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /v1/organizations/{organization_id}/conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get conversation details
      operationId: getConversation
      description: Retrieves a single conversation by ID.
      security:
        - BearerAuth: [conversations:read]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Conversation record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /v1/organizations/{organization_id}/conversations/{id}/messages:
    get:
      tags: [Conversations]
      summary: List conversation messages
      operationId: listConversationMessages
      description: Retrieves chronological messages within a conversation.
      security:
        - BearerAuth: [conversations:read]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/LimitQuery'
        - name: before_id
          in: query
          required: false
          schema:
            type: string
          description: Message ID pagination cursor
      responses:
        '200':
          description: List of conversation messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    post:
      tags: [Conversations]
      summary: Send message to conversation
      operationId: sendConversationMessage
      description: Appends an operator or bot reply message to the conversation and dispatches it through the active channel.
      security:
        - BearerAuth: [conversations:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Message dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessage'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /v1/organizations/{organization_id}/conversations/{id}/handoff:
    post:
      tags: [Conversations]
      summary: Handoff conversation to agent or human operator
      operationId: handoffConversation
      description: Transfers conversation routing to a human inbox or another AI agent.
      security:
        - BearerAuth: [conversations:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
      responses:
        '200':
          description: Handoff executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /v1/organizations/{organization_id}/conversations/{id}/resolve:
    post:
      tags: [Conversations]
      summary: Resolve conversation
      operationId: resolveConversation
      description: Marks a conversation as resolved, updating state and triggering memory classification.
      security:
        - BearerAuth: [conversations:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Conversation resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /v1/organizations/{organization_id}/ws_tickets:
    post:
      tags: [Realtime WebSockets]
      summary: Generate operator WebSocket ticket
      operationId: createOperatorWSTicket
      description: Issues a single-use, 60-second connection ticket for connecting to the operator WebSocket endpoint.
      security:
        - BearerAuth: [conversations:read]
      parameters:
        - $ref: '#/components/parameters/OrgID'
      responses:
        '200':
          description: Ticket generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSTicketResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /v1/ws/operator:
    get:
      tags: [Realtime WebSockets]
      summary: Operator WebSocket connection
      operationId: connectOperatorWS
      description: Upgrades HTTP connection to full-duplex WebSocket stream for real-time conversation and event monitoring. Requires ticket query parameter.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
          description: Single-use operator ticket minted via POST /v1/organizations/{org_id}/ws_tickets
      responses:
        '101':
          description: Switching Protocols to WebSocket
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /v1/guest/sessions:
    post:
      tags: [Realtime WebSockets]
      summary: Mint visitor guest session
      operationId: createGuestSession
      description: Public browser endpoint permitting Cerebronix Chat Widget to initiate an anonymous visitor session. Permitted for allowed web chat origins via CORS.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSessionRequest'
      responses:
        '200':
          description: Visitor guest session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /v1/ws/visitor:
    get:
      tags: [Realtime WebSockets]
      summary: Visitor WebSocket connection
      operationId: connectVisitorWS
      description: Real-time chat streaming WebSocket for end-user visitors. Requires session_token query parameter.
      security: []
      parameters:
        - name: session_token
          in: query
          required: true
          schema:
            type: string
          description: Visitor session token issued by POST /v1/guest/sessions
      responses:
        '101':
          description: Switching Protocols to WebSocket
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /v1/organizations/{organization_id}/contacts:
    get:
      tags: [Contacts]
      summary: List contacts
      operationId: listContacts
      description: Retrieves stored customer contacts with optional keyword filtering.
      security:
        - BearerAuth: [contacts:read]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Search by name, email, or phone number
      responses:
        '200':
          description: Contact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
    post:
      tags: [Contacts]
      summary: Create contact
      operationId: createContact
      description: Registers a new customer contact with standard profile fields and custom key-value attributes.
      security:
        - BearerAuth: [contacts:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '201':
          description: Contact created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /v1/organizations/{organization_id}/contacts/{id}:
    get:
      tags: [Contacts]
      summary: Get contact details
      operationId: getContact
      description: Retrieves contact record by ID.
      security:
        - BearerAuth: [contacts:read]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Contact record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    patch:
      tags: [Contacts]
      summary: Update contact
      operationId: updateContact
      description: Modifies contact name, phone, email, or custom metadata attributes.
      security:
        - BearerAuth: [contacts:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
      responses:
        '200':
          description: Contact updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags: [Contacts]
      summary: Delete contact
      operationId: deleteContact
      description: Removes contact record from the organization directory.
      security:
        - BearerAuth: [contacts:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Contact removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /v1/organizations/{organization_id}/contact_groups:
    get:
      tags: [Contact Groups]
      summary: List contact groups
      operationId: listContactGroups
      description: Retrieves contact audience groups for campaign targeting.
      security:
        - BearerAuth: [groups:read]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Contact group list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactGroupList'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
    post:
      tags: [Contact Groups]
      summary: Create contact group
      operationId: createContactGroup
      description: Defines a new contact audience segment.
      security:
        - BearerAuth: [groups:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactGroup'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /v1/organizations/{organization_id}/contact_groups/{id}:
    get:
      tags: [Contact Groups]
      summary: Get contact group details
      operationId: getContactGroup
      description: Retrieves contact group details and member count.
      security:
        - BearerAuth: [groups:read]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Contact group record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactGroup'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    patch:
      tags: [Contact Groups]
      summary: Update contact group
      operationId: updateContactGroup
      description: Updates contact group name or description.
      security:
        - BearerAuth: [groups:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactGroupRequest'
      responses:
        '200':
          description: Contact group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactGroup'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags: [Contact Groups]
      summary: Delete contact group
      operationId: deleteContactGroup
      description: Removes audience group without deleting member contact records.
      security:
        - BearerAuth: [groups:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Contact group deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /v1/organizations/{organization_id}/contact_groups/{id}/members:
    post:
      tags: [Contact Groups]
      summary: Add members to group
      operationId: addContactGroupMembers
      description: Adds a list of contact IDs to the audience group.
      security:
        - BearerAuth: [groups:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMembersRequest'
      responses:
        '200':
          description: Members added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembersResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags: [Contact Groups]
      summary: Remove members from group
      operationId: removeContactGroupMembers
      description: Removes specific contact IDs from the audience group.
      security:
        - BearerAuth: [groups:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMembersRequest'
      responses:
        '200':
          description: Members removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembersResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /v1/organizations/{organization_id}/whatsapp/templates:
    get:
      tags: [Outreach & WhatsApp]
      summary: List approved WhatsApp templates
      operationId: listWhatsAppTemplates
      description: Retrieves Meta-approved WhatsApp Business message templates registered for the organization.
      security:
        - BearerAuth: [whatsapp:send]
      parameters:
        - $ref: '#/components/parameters/OrgID'
      responses:
        '200':
          description: List of approved WhatsApp templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppTemplateList'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503Unavailable'

  /v1/organizations/{organization_id}/whatsapp/templates/{name}/send:
    post:
      tags: [Outreach & WhatsApp]
      summary: Send transactional WhatsApp template message
      operationId: sendWhatsAppTemplate
      description: Dispatches an approved WhatsApp Business template message to a verified recipient phone number or contact ID.
      security:
        - BearerAuth: [whatsapp:send]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Registered WhatsApp template name
          example: order_shipping_update
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendWhatsAppTemplateRequest'
      responses:
        '200':
          description: WhatsApp template message dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessageResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '402':
          $ref: '#/components/responses/402PaymentRequired'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503Unavailable'

  /v1/organizations/{organization_id}/campaigns:
    post:
      tags: [Outreach & WhatsApp]
      summary: Create WhatsApp broadcast campaign
      operationId: createCampaign
      description: Enqueues an outbound broadcast campaign to a contact group or recipient contact ID list.
      security:
        - BearerAuth: [campaigns:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Campaign created and enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '402':
          $ref: '#/components/responses/402PaymentRequired'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /v1/organizations/{organization_id}/campaigns/{id}:
    get:
      tags: [Outreach & WhatsApp]
      summary: Get campaign status and delivery metrics
      operationId: getCampaign
      description: Retrieves campaign delivery status and aggregate delivery counters.
      security:
        - BearerAuth: [campaigns:write]
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Campaign record and progress statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /v1/organizations/{organization_id}/webhook_subscriptions:
