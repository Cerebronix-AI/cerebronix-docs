          type: string
          enum: ["2.0"]
          example: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
          example: 1
        result:
          type: object
          properties:
            content:
              type: array
              items:
                type: object
                required: [type, text]
                properties:
                  type:
                    type: string
                    example: text
                  text:
                    type: string
            structuredContent:
              type: object
              additionalProperties: true
            tools:
              type: array
              items:
                type: object
        error:
          $ref: '#/components/schemas/MCPRPCError'

    MCPRPCError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: -32602
        message:
          type: string
          example: confirm_required
