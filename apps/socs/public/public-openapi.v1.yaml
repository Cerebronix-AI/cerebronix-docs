components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 Bearer access token minted via POST /v1/oauth/token
    OAuth2:
      type: oauth2
      description: Standard OAuth2 client credentials grant flow exposing all 19 grantable platform scopes
      flows:
        clientCredentials:
          tokenUrl: https://public-api.cerebronix.com/v1/oauth/token
          scopes:
            conversations:read: Read conversation threads, transcripts, and metadata
            conversations:write: Send messages, trigger handoffs, and resolve conversations
            contacts:read: Read customer contact directory
            contacts:write: Create, update, and delete customer contacts
            groups:read: Read customer contact groups and membership lists
            groups:write: Create, update, delete contact groups and manage memberships
            whatsapp:send: List approved WhatsApp templates and dispatch template messages
            campaigns:write: Create and inspect outbound broadcast campaigns
            agents:read: Read configured AI agents and omnichannel channel endpoints
            agents:write: Create and configure AI agents, instructions, and channel bindings
            ask_agent: Execute grounded AI agent direct inference
            datasources:read: Read knowledge data sources and indexing status
            datasources:write: Create, update, delete knowledge data sources and trigger reindexing
            analytics:read: Read aggregated conversation volume and operational analytics
            billing:read: Read credit balance, subscription entitlements, and ledger transactions
            webhooks:read: Read webhook subscriptions and delivery configurations
            webhooks:write: Create, update, delete webhook subscriptions and rotate signing secrets
            mcp: Execute Model Context Protocol tools over JSON-RPC 2.0
            offline_access: Extended token lifetime and refresh authorization

  parameters:
    OrgID:
      name: organization_id
      in: path
      required: true
      schema:
        type: string
      description: 24-character hexadecimal organization tenant identifier
      example: 67123456789abcdef0123456

    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 24-character hexadecimal resource identifier
      example: 67123456789abcdef0123499

    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100
      description: Maximum number of records to return per page

    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from next_cursor

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Unique UUIDv4 token preventing duplicate mutation executions
      example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d

    PreferHeader:
      name: Prefer
      in: header
      required: false
      schema:
        type: string
        enum: [respond-async]
      description: Set to respond-async to enqueue asynchronous execution returning HTTP 202 Accepted

  responses:
    400BadRequest:
      description: Malformed payload, invalid format, or failing validation schema
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid_request

    401Unauthorized:
      description: Missing, invalid, or expired Bearer JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid_token

    402PaymentRequired:
      description: Platform credit pool exhausted and overage billing not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: insufficient_credits

    403Forbidden:
      description: Token lacks required scope, insufficient role, or programmatic API disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: missing_scope

    404NotFound:
      description: Requested resource was not found within the authenticated organization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: not_found

    429TooManyRequests:
      description: Request rate exceeded plan quota limits
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: rate_limited

    503Unavailable:
      description: Underlying engine or downstream orchestrator temporarily unreachable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unavailable

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Standard machine-readable error token
          example: invalid_request

    JWKSResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, alg, n, e]
            properties:
              kty:
                type: string
                example: RSA
              kid:
                type: string
                example: cnx_pub_2026_01
              alg:
                type: string
                example: RS256
              use:
                type: string
                example: sig
              n:
                type: string
                description: RSA modulus
              e:
                type: string
                description: RSA exponent
                example: AQAB

    TokenRequest:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          example: client_credentials
        client_id:
          type: string
          description: Public API Key Client ID
          example: ak_01923456789a
        client_secret:
          type: string
          description: Confidential API Key Secret
          example: csk_live_01923456789abcdef0123456789
        audience:
          type: string
          description: Optional target API audience
          example: cerebronix-public

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Signed RS256 JSON Web Token
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds (default 3600)
          example: 3600
        scope:
          type: string
          description: Space-delimited granted scopes
          example: conversations:read conversations:write ask_agent

    ActorMe:
      type: object
      required: [actor_id, organization_id, role]
      properties:
        actor_id:
          type: string
          example: ak_01923456789a
        organization_id:
          type: string
          example: 67123456789abcdef0123456
        role:
          type: string
          enum: [viewer, developer]
          example: developer
        name:
          type: string
          example: Production Integration Key

